[project]
name = "ambush-streams-centaur"
description = "Create and manage shared Ambush news streams from Centaur"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1",
    "rich>=13.0.0,<15",
    "typer>=0.12.0,<1",
]

[project.scripts]
ambush-streams = "centaur_tool_ambush_streams.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
    "/.gitignore",
    "/PKG-INFO",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_ambush_streams"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["api.ambush.ai"]
secrets = [
    {type = "http", name = "AMBUSH_API_KEY", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["api.ambush.ai"]},
]
